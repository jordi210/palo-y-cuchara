name: Diagnostico temporal de resolucion fotografica
on:
  push:
    paths:
      - ".github/workflows/prueba-resolucion-noviembre.yml"
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar descarga de originales sin alterar fotografías
        env:
          MEDIA_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:150/quality:75/uri:ifs%3A%2F%2FM%2F37cedbc4-9a9a-48a8-9574-99b37cfd155a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANcxCBOtsKG_28VDSA1ozFgPqjEVr3Yqzr_SekB1_dh0&exp=1794364657&osig=AAAAAAAAAAAAAAAAAAAAALDmxA4chZMVWeoi62HvnIcPijFmb003xP8HL_BHPDnt&signer=media-rpc&token=AAIAAU0AJDM3Y2VkYmM0LTlhOWEtNDhhOC05NTc0LTk5YjM3Y2ZkMTU1YQAAAAABoch3zWiNg3D_Ro4tZ2uoi_UiBkyiEHqnwtaBS2p_Q1xknyueGg&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
          import os,requests
          from PIL import Image
          from io import BytesIO
          u=os.environ["MEDIA_URL"]
          tests={
            "thumbnail":u,
            "larger_path":u.replace("height:150","height:900").replace("width:200","width:1200"),
            "no_thumbnail_quality":u.replace("&x-canva-quality=thumbnail",""),
            "add_width_query":u+"&width=1200",
            "change_quality_path":u.replace("quality:75","quality:95")
          }
          for label,url in tests.items():
            try:
              r=requests.get(url,timeout=12)
              try: im=Image.open(BytesIO(r.content));sz=str(im.size)
              except Exception:sz="not_image"
              print(label,r.status_code,len(r.content),sz,r.text[:65] if sz=="not_image" else "")
            except Exception as e:print(label,str(e)[:80])
          PY
