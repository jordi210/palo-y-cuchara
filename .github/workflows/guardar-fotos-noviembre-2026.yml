name: Guardar fotografías del torneo de noviembre 2026
on:
  push:
    paths:
      - ".github/workflows/guardar-fotos-noviembre-2026.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descargar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
