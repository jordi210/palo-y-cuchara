        run: |
          set -euo pipefail
          mkdir -p imagenes/torneo-noviembre-2026
          for n in $(seq -w 1 14); do
            var="FOTO_${n}"
            src="${!var}"
            dest="imagenes/torneo-noviembre-2026/foto-${n}.jpg"
            # Solicitar la imagen ampliada; si Canva no admite cambiar las dimensiones con el enlace,
            # descargar la imagen válida de vista previa.
            full="${src/height:150/height:900}"
            full="${full/width:200/width:1200}"
            full="${full/height:200/height:1200}"
            full="${full/width:150/width:900}"
            if ! curl --fail --location --silent --show-error --retry 2 --max-time 45 "${full}" --output "${dest}"; then
              curl --fail --location --silent --show-error --retry 2 --max-time 45 "${src}" --output "${dest}"
            fi
            test -s "${dest}"
            file "${dest}"
          done
      - name: Confirmar las fotografías en el repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagenes/torneo-noviembre-2026/
          if ! git diff --cached --quiet; then
            git commit -m "Añadir 14 fotografías del torneo noviembre 2026"
            git push
          fi
