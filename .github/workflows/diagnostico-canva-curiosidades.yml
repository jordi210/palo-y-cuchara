name: Diagnóstico temporal recursos de Curiosidades Canva
on:
  push:
    paths: [".github/workflows/diagnostico-canva-curiosidades.yml"]
  workflow_dispatch:
jobs:
  examinar:
    runs-on: ubuntu-latest
    steps:
      - name: Examinar recursos públicos de Canva
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,html
          s=requests.get('https://paloycucara.my.canva.site/palo-y-cuchara',timeout=20).text
          ids=['MAGXL0U81to','MAGXL-SoNhI','MAGXLymd5dI','VAGXL1BPBX4','MAGgPNfzlK0','VAGmIl14qx8','MAGXL1iWxr0']
          for id in ids:
            for m in list(re.finditer(r'\"id\":\"'+id+r'\"',s))[-3:]:
              print('ASSET',id,'context',s[max(0,m.start()-42):m.start()+850][:890])
          PY
