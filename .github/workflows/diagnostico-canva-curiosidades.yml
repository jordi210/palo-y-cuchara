name: Diagnóstico temporal recursos de Curiosidades Canva
on:
  push:
    paths: [".github/workflows/diagnostico-canva-curiosidades.yml"]
  workflow_dispatch:
jobs:
  examinar:
    runs-on: ubuntu-latest
    steps:
      - name: Examinar recursos públicos de Canva
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,collections,html
          u='https://paloycucara.my.canva.site/palo-y-cuchara'
          r=requests.get(u,timeout=18);s=r.text
          print('SIZE',len(s),'IMAGES',s.count('<img'),'ASSETS',s.count('_assets/'),'CSS BG',s.count('background-image'))
          for q in ['Hoyo 1','Procesionaria','Las reglas locales','El moncayo','Bodegon 5']:
            idx=s.find(q);print('TITLE',q,'index',idx,'SEGMENT',s[max(0,idx-1100):idx+330].replace(chr(10),' ')[:1600])
          matches=re.findall(r'_assets/[a-zA-Z0-9_./%-]+',s)
          print('ASSET FIRST',matches[:50]);print('ASSET COUNT',len(matches),'UNIQUE',len(set(matches)))
          print('RESOURCE EXTENSIONS',collections.Counter(m.split('.')[-1] for m in matches))
          PY
