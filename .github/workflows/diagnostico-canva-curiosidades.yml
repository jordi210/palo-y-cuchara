name: Diagnóstico temporal recursos de Curiosidades Canva
on:
  push:
    paths: [".github/workflows/diagnostico-canva-curiosidades.yml"]
  workflow_dispatch:
jobs:
  examinar:
    runs-on: ubuntu-latest
    steps:
      - name: Examinar recursos públicos de Canva
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,html,collections
          s=requests.get('https://paloycucara.my.canva.site/palo-y-cuchara',timeout=18).text
          for q in ['MAGXL0U81to','MAGXL-SoNhI','VAGXL1BPBX4','MAGgPNfzlK0','_assets/media/','PBrBJ6MKXqFjbbxL','PBcr41BRSXfhLxls','_assets/media/fe76ad0b10ab1197e2640dd9c72d7660.jpg']:
            idx=s.find(q);print('FIND',q,'at',idx,'CONTEXT',s[max(0,idx-270):idx+290][:560]);
          print('MEDIA SAMPLES',re.findall(r'_assets/media/[a-z0-9]{32}\\.(?:jpg|png|mp4)',s)[:12])
          print('MEDIA PATTERN COUNT',len(set(re.findall(r'_assets/media/[a-z0-9]{32}\\.(?:jpg|png|mp4)',s))))
          PY
